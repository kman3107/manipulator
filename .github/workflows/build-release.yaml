---
name: Release

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync project dependencies
        run: uv sync --locked

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run --with pyinstaller pyinstaller \
            --noconsole \
            --onedir \
            --noupx \
            --clean \
            --name Manipulator \
            --collect-all tkinterdnd2 \
            --collect-all sv_ttk \
            main.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Manipulator -DestinationPath Manipulator-${{ matrix.label }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf Manipulator-${{ matrix.label }}.tar.gz Manipulator

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manipulator-${{ matrix.label }}
          path: Manipulator-${{ matrix.label }}.*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Manipulator-*
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Manipulator-windows-x64.zip
            artifacts/Manipulator-linux-x64.tar.gz
